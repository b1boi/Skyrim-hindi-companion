# ==============================================================================
# Skyrim Hindi AI Companion — Central Configuration
# Persona: 'सरकार भैया' (Sarkar Bhaiya)
# Hardware: AMD Radeon RX 6800 (16 GB VRAM) | CachyOS / Arch Linux
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Hardware & Execution Environment
# ------------------------------------------------------------------------------
hardware:
  gpu: "AMD Radeon RX 6800 (16GB VRAM)"
  system_ram_gb: 24
  os: "CachyOS / Arch Linux"
  preferred_backend: "vulkan"       # Vulkan with full GPU offloading (no CUDA dependencies)
  gpu_offload_layers: "all"         # 100% offload into 16GB VRAM

general:
  provider: "local"                 # "local" (Faster-Whisper / Coqui XTTS / LM Studio) or "sarvam"
  device: "auto"                    # "auto", "cpu" (ROCm/Vulkan managed via LM Studio & local runtime)
  seed: 42
  debug: false

# ------------------------------------------------------------------------------
# 2. Large Language Model (LM Studio / OpenAI-Compatible)
# ------------------------------------------------------------------------------
llm:
  backend: "openai_compatible"
  api_base: "http://127.0.0.1:1234/v1"
  api_key: "none"
  # Target model in LM Studio. Discovered automatically via GET /v1/models if available:
  model_name: "bartowski/Google_Gemma-4-E2B-Instruct-GGUF"
  context_window: 8192              # Full 8192 context window for Gemma 4
  max_tokens: 96                    # Snappy 80-96 tokens for instantaneous dialogue
  temperature: 0.7
  top_p: 0.9
  stream: true
  auto_discover_model: true         # Query /v1/models dynamically on launch
  timeout_sec: 30.0

# ------------------------------------------------------------------------------
# 3. Persona & Character Rules — 'सरकार भैया' (Sarkar Bhaiya)
# ------------------------------------------------------------------------------
persona:
  name: "सरकार भैया"
  oratory_style: "theatrical_national_orator"
  language: "Devanagari Hindi"
  profanity_chance: 0.33            # ~1 in 3 eligible interactions (33%) contains an insult
  meltdown_chance: 0.02             # ~2% rare meltdown probability
  credit_stealing: true             # Claims player kills and triumphs as his own
  blame_player: true                # Blames player for damage and deaths

  # Configurable profanity tiers targeting strictly player gameplay mistakes:
  profanity_vocabulary:
    light:
      - "साला"
      - "कमीना"
      - "हरामी"
      - "गधा"
    medium:
      - "चूतिया"
      - "गांडू"
      - "भोसड़ीके"
      - "लोडू"
    heavy:
      - "भेनचोद"
      - "मादरचोद"

# ------------------------------------------------------------------------------
# 4. Automatic Speech Recognition (ASR) via Faster-Whisper
# ------------------------------------------------------------------------------
asr:
  model_id: "medium"                # "tiny", "base", "small", "medium", "large-v3"
  device: "auto"                    # "auto" (CPU / Vulkan / ROCm)
  compute_type: "default"           # "float32", "int8", "default"
  language: "hi"                    # Forced Hindi decoding
  task: "transcribe"
  beam_size: 5
  best_of: 5
  temperature: 0.0
  vad_filter: true
  vad_parameters:
    min_silence_duration_ms: 500
    speech_pad_ms: 200
  mic_sample_rate: 16000
  channels: 1
  energy_threshold: 0.015
  silence_timeout_sec: 1.6

# ------------------------------------------------------------------------------
# 5. Text-to-Speech (TTS) via Coqui XTTS-v2 & Streaming Sentence Chunker
# ------------------------------------------------------------------------------
tts:
  model_id: "tts_models/multilingual/multi-dataset/xtts_v2"
  device: "auto"                    # "auto", "cpu"
  language: "hi"
  reference_audio_path: "data/reference_speaker.wav"
  sample_rate: 24000
  temperature: 0.65
  length_penalty: 1.0
  repetition_penalty: 2.0
  speed: 1.02
  enable_streaming: true            # Sentence/clause streaming into sequential playback queue
  min_sentence_chars: 20            # Minimum characters before emitting sentence chunk
  audio_output_dir: "eval/results/audio_samples"

# ------------------------------------------------------------------------------
# 6. UESP Knowledge Base & Lore Retrieval (https://en.uesp.net/wiki/)
# ------------------------------------------------------------------------------
knowledge_base:
  enabled: true
  source_url: "https://en.uesp.net/wiki/"
  api_endpoint: "https://en.uesp.net/w/api.php"
  cache_path: "data/skyrim_lore_kb.json"
  dump_path: "uespwiki-2026-10-25-current.xml.bz2"
  dump_db_path: "data/uesp_knowledge_base.db"
  max_context_chars: 280
  enable_online_fetch: true

# ------------------------------------------------------------------------------
# 7. Sarvam AI Indic Cloud Services (Optional Provider)
# ------------------------------------------------------------------------------
sarvam:
  api_key: "${SARVAM_API_KEY}"      # Loaded securely from SARVAM_API_KEY environment variable only
  tts:
    model: "bulbul:v4-flash"
    speaker: "arvind"               # "arvind", "meera", "ishita_enhi_companion", "amartya"
    pace: 1.02
    sample_rate: 24000
  stt:
    model: "saaras:v4"
    language_code: "hi-IN"
  llm:
    model: "sarvam-2b"
    api_base: "https://api.sarvam.ai/v1"

# ------------------------------------------------------------------------------
# 8. Transliteration & Normalization
# ------------------------------------------------------------------------------
transliteration:
  enabled: true
  lore_dict_path: "data/lore_transliteration.json"
  convert_numbers_to_words: true
  strip_latin_artifacts: true
  normalize_danda: true

# ------------------------------------------------------------------------------
# 9. Latency SLAs & Benchmarking Targets
# ------------------------------------------------------------------------------
latency:
  stt_max_ms: 800
  normalization_max_ms: 50
  llm_ttft_max_ms: 600
  tts_ttfa_max_ms: 900
  first_audible_max_ms: 1200
  e2e_max_ms: 2800

eval:
  test_prompts_path: "eval/test_prompts.json"
  results_dir: "eval/results"
  save_audio_samples: true
  max_prompts: 30
